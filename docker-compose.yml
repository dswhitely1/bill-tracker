# The whole stack. `docker compose up --build --wait` gives you a working
# application on http://localhost:8080 with no further steps.
#
# JWT_ACCESS_SECRET has no default anywhere, here included — see the `api`
# service. Generate one into .env before the first run:
#
#   echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> .env

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: don
      POSTGRES_PASSWORD: super
      POSTGRES_DB: bills
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U don -d bills"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Reminder digests land in a web UI at http://localhost:8025 instead of the
  # API's log, which makes the SMTP transport a real path rather than one only
  # unit tests exercise.
  mailpit:
    image: axllent/mailpit:latest
    container_name: bills_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Runs to completion and exits. The API waits on it rather than running
  # migrations itself, which keeps schema changes off the path to accepting
  # traffic and makes the step visible in `docker compose ps`.
  #
  # Shares the API image: the migration runner is a second bundle inside it
  # (`migrate.js`), so both get one dependency install.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: bills-api:local
    container_name: bills_migrate
    command: ["node", "migrate.js"]
    environment:
      NODE_ENV: production
      # `postgres`, not `localhost`. Inside a container localhost is the
      # container, which is why this cannot come from the host's .env.
      DATABASE_URL: postgres://don:super@postgres:5432/bills
      DB_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: bills-api:local
    container_name: bills_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Container-network values, set here rather than via env_file: the
      # host's .env points DATABASE_URL at localhost:5432, which inside this
      # container means this container.
      DATABASE_URL: postgres://don:super@postgres:5432/bills
      DB_SSL: "false"
      # The browser's origin, which is nginx — never the API's own port. CORS
      # is keyed to this, and the refresh cookie depends on the browser only
      # ever seeing one origin.
      WEB_ORIGIN: http://localhost:8080
      # `:?` rather than a default. A fallback secret would be a secret in
      # source control, so compose refuses to start without one instead.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?generate one - see the header of this file}
      JWT_ACCESS_TTL: 15m
      REFRESH_TTL_DAYS: "30"
      BCRYPT_COST: "12"
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      # Pointing this at Mailpit is what switches the transport from logging
      # to real SMTP. Unset it and digests go to `docker compose logs api`.
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: reminders@bill-tracker.local
    # Exposed for curl, not for the browser — the client only ever talks to
    # nginx, and a request straight to this port is CORS-blocked by design.
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      # The whole point of the one-shot service: a non-zero exit from migrate
      # holds the API back rather than letting it serve against a schema that
      # was never applied.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # node rather than curl or wget — neither is in the runtime image, and a
      # healthcheck that always errors reads as a broken service.
      # 127.0.0.1, not localhost: the servers here bind IPv4 only, and
      # `localhost` inside these images can resolve to ::1 first — which
      # yields a connection-refused that looks exactly like a dead service.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: bills-web:local
    container_name: bills_web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 for the same reason as the API's check: nginx listens on
      # IPv4 only, and busybox wget resolves `localhost` to ::1 first, so
      # this check failed against a perfectly healthy server.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
