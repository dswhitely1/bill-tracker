server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Raised from the 8k default because cookies ignore ports. Everything
    # ever served from localhost — `nx serve` on 4200, Playwright on 4300,
    # any other project on any port — sets cookies the browser then sends
    # here too, and a jar accumulated over months of development overflows
    # one header buffer. The failure is a bare 400 with nothing in the
    # error log, which looks like a broken server rather than a fat
    # request: a browser gets 400 while curl gets 200 from the same
    # address. curl just has no cookies.
    large_client_header_buffers 4 32k;

    # `/api` is proxied rather than the client being pointed at the API's own
    # origin, and that is load-bearing rather than convenience. API_BASE is
    # the relative path '/api' (apps/web/src/app/core/api/api.constants.ts),
    # baked into the bundle at build time, so requests go wherever the bundle
    # was served from. Proxying also keeps the refresh cookie first-party —
    # the same arrangement apps/web/proxy.conf.json makes in development, and
    # the condition the auth design relies on when it sets SameSite=Lax.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API is the only thing that should decide how long a request may
        # take; nginx's 60s default would turn a slow reminder run into a 504
        # the client cannot distinguish from a crash.
        proxy_read_timeout 120s;
    }

    # Hashed build artifacts are immutable by construction.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a client keeps loading a bundle
    # whose hashed assets a later deploy has already removed.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA history fallback. Angular owns the routes, so any path that is not a
    # real file has to reach index.html — without this, reloading on
    # /notifications or /upcoming is a 404 from nginx rather than a route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
